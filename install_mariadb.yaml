---
- name: Install mariadb
  hosts: localhost
  remote_user: ec2-user
  become: true

  vars:
    # Supply the password at run time, never in the repo:
    #   export MARIADB_USER_PASSWORD='...'   (or use ansible-vault)
    mariadb_user_password: "{{ lookup('env', 'MARIADB_USER_PASSWORD') }}"

  tasks:
    - name: Fail early if no database password was supplied
      ansible.builtin.assert:
        that: mariadb_user_password | length > 0
        fail_msg: "Set MARIADB_USER_PASSWORD before running this playbook."

    - name: install mariadb
      yum:
        name: mariadb-server
        state: present

    - name: Start and Enable Mariadb
      systemd:
        name: mariadb
        state: started
        enabled: true

    - name: install MySQL client library to allow use of mysql_user
      yum:
        name: python2-PyMySQL
        state: present

    - name: Create a new database with name 'bobdata'
      mysql_db:
        name: bobdata
        state: present

    - name: create user  
      mysql_user:
        name: Bob
        password: "{{ mariadb_user_password }}"
        priv: 'bobdata.*:ALL'   # least privilege: only the app database
        state: present

    - name: shell to create table and import data
      ansible.builtin.shell:
        cmd: mysql -u root bobdata < quotes.sql
        
